<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">

<a th:replace="~{fragments/items :: back-link(url='/grading/' + ${submission.id}, label=${submission.submissionName})}"></a>

<div class="d-flex justify-content-between align-items-start mb-4">
    <div class="flex-grow-1 me-3 min-w-0">
        <h4 class="mb-1">Edit Submission</h4>
        <small class="text-muted" th:text="${submission.submissionName} + ' · ' + ${submission.company}"></small>
    </div>
    <span th:replace="~{fragments/items :: grading-status-badge(status=${submission.status})}"></span>
</div>

<form method="POST" th:action="'/grading/' + ${submission.id}">
    <div th:replace="~{fragments/forms :: grading-submission-fields(submission=${submission})}"></div>

    <div th:if="${#lists.isEmpty(rawItems) and #lists.isEmpty(gradedItems)}" class="card mb-3">
        <div class="card-body text-muted">No items in your inventory yet. <a href="/lots/new">Add a lot</a> and mark cards as tracked.</div>
    </div>

    <div th:replace="~{fragments/items :: item-picker-table(items=${rawItems}, label='Raw Cards', checkboxName='itemIds', attachedIds=${attachedIds})}"></div>
    <div th:replace="~{fragments/items :: item-picker-table(items=${gradedItems}, label='Previously Graded', checkboxName='itemIds', attachedIds=${attachedIds})}"></div>

    <div class="d-flex justify-content-end"><button type="submit" class="btn btn-success">Save</button></div>
</form>

</div>
</body>
</html>
