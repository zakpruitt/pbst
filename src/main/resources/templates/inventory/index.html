<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">Inventory</h4>
    <a href="/inventory/new" class="btn btn-success btn-sm">Add Item</a>
</div>

<div th:replace="~{inventory/index :: inventory-page}"></div>

</div>

<!-- HTMX-swappable fragment -->
<div th:fragment="inventory-page" id="inventory-page">
<ul class="nav nav-tabs mb-4">
    <li class="nav-item">
        <a class="nav-link" th:classappend="${data.purpose == 'INVENTORY' ? 'active' : ''}"
           href="/inventory?purpose=INVENTORY"
           hx-get="/inventory?purpose=INVENTORY"
           hx-target="#inventory-page"
           hx-swap="outerHTML"
           hx-push-url="true">Inventory</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:classappend="${data.purpose == 'IN_GRADING' ? 'active' : ''}"
           href="/inventory?purpose=IN_GRADING"
           hx-get="/inventory?purpose=IN_GRADING"
           hx-target="#inventory-page"
           hx-swap="outerHTML"
           hx-push-url="true">In Grading</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:classappend="${data.purpose == 'PERSONAL_COLLECTION' ? 'active' : ''}"
           href="/inventory?purpose=PERSONAL_COLLECTION"
           hx-get="/inventory?purpose=PERSONAL_COLLECTION"
           hx-target="#inventory-page"
           hx-swap="outerHTML"
           hx-push-url="true">Personal Collection</a>
    </li>
</ul>

<div th:if="${!#lists.isEmpty(data.items)}" class="card mb-3">
    <div class="card-body">
        <div class="row text-center">
            <div th:replace="~{fragments/items :: stat-col(label='Cost', value='$' + ${#numbers.formatDecimal(data.totalCost, 1, 2)}, valueClass='')}"></div>
            <div th:replace="~{fragments/items :: stat-col(label='Market', value='$' + ${#numbers.formatDecimal(data.totalMarket, 1, 2)}, valueClass='')}"></div>
            <div th:replace="~{fragments/items :: stat-col(label='Items', value=${#lists.size(data.items)}, valueClass='')}"></div>
            <div th:replace="~{fragments/items :: stat-col(label='Gain/Loss', value='$' + ${#numbers.formatDecimal(data.totalMarket - data.totalCost, 1, 2)}, valueClass=${data.totalMarket - data.totalCost >= 0 ? 'text-success' : 'text-danger'})}"></div>
        </div>
    </div>
</div>

<div id="inventory-list">
    <p th:if="${#lists.isEmpty(data.items)}" class="text-muted">No items in this category.</p>

    <div th:if="${!#lists.isEmpty(data.items)}">
        <div th:replace="~{inventory/index :: inventory-section(items=${data.rawItems}, label='Raw', showGrade=false)}"></div>
        <div th:replace="~{inventory/index :: inventory-section(items=${data.gradedItems}, label='Graded', showGrade=true)}"></div>
        <div th:replace="~{inventory/index :: inventory-section(items=${data.sealedItems}, label='Sealed', showGrade=false)}"></div>
        <div th:replace="~{inventory/index :: inventory-section(items=${data.otherItems}, label='Other', showGrade=false)}"></div>
    </div>
</div>
</div>

<!-- One item-type section: pill header + table; Grade column only for graded items -->
<div th:fragment="inventory-section(items, label, showGrade)" th:if="${!#lists.isEmpty(items)}" class="mb-4">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <span th:replace="~{fragments/items :: section-pill(label=${label})}"></span>
        <span class="text-muted small" th:text="${#lists.size(items)} + ' items'"></span>
    </div>
    <table class="table table-hover bg-white mb-0">
        <thead class="table-light">
        <tr>
            <th style="width:100%">Item</th>
            <th th:if="${showGrade}" class="text-center text-nowrap ps-4">Grade</th>
            <th class="text-center text-nowrap ps-4">Cost Basis</th>
            <th class="text-center text-nowrap ps-4">Market</th>
            <th class="text-center text-nowrap ps-4"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}" th:with="mkt=${item.marketValueAtPurchase != 0 ? item.marketValueAtPurchase : (item.pokemonCard != null and item.pokemonCard.marketPrice != 0 ? item.pokemonCard.marketPrice : 0)}">
            <td>
                <div th:replace="~{fragments/items :: item-cell-detailed(item=${item})}"></div>
            </td>
            <td th:if="${showGrade}" class="text-center align-middle text-nowrap ps-4">
                <th:block th:replace="~{fragments/items :: type-badge(item=${item})}"></th:block>
            </td>
            <td class="text-center align-middle text-nowrap ps-4 fw-medium"
                th:title="${item.gradingFee > 0 ? 'Lot $' + #numbers.formatDecimal(item.costBasis, 1, 2) + ' + Grading $' + #numbers.formatDecimal(item.gradingFee, 1, 2) : ''}"
                th:text="'$' + ${#numbers.formatDecimal(item.totalCostBasis, 1, 2)}"></td>
            <td class="text-center align-middle text-nowrap ps-4 text-muted" th:text="${mkt != 0 ? '$' + #numbers.formatDecimal(mkt, 1, 2) : '—'}"></td>
            <td class="text-center align-middle text-nowrap ps-4">
                <a th:href="'/inventory/' + ${item.id} + '/edit'" class="btn btn-outline-secondary btn-sm">Edit</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
