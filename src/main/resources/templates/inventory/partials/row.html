<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="inventory-row(preset)"
     class="item-row card mb-2"
     x-data="inventoryRow"
     th:data-name="${preset.name}"
     th:data-cost-basis="${preset.costBasis}"
     th:data-market="${preset.marketValue}"
     th:data-type="${preset.itemType}"
     th:data-grading-company="${preset.gradingCompany != null ? preset.gradingCompany : 'PSA'}"
     th:data-card-id="${preset.pokemonCardId != null ? preset.pokemonCardId : ''}"
     th:data-sealed-id="${preset.sealedProductId != null ? preset.sealedProductId : ''}"
     th:data-image-url="${preset.imageUrl != null ? preset.imageUrl : ''}"
     th:data-set-name="${preset.setName != null ? preset.setName : ''}"
     th:data-card-number="${preset.cardNumber != null ? preset.cardNumber : ''}"
     :style="'border-left:3px solid '+borderColor">

    <div class="d-flex gap-3 p-2 align-items-center">

        <template x-if="imageUrl">
            <div class="lot-img-wrap">
                <img :src="imageUrl" :data-card-img="imageUrl"
                     class="img-fluid rounded shadow-sm obj-fit-contain">
            </div>
        </template>

        <div class="flex-grow-1 d-flex flex-column lot-row-content">

            <div class="d-flex gap-2 align-items-center w-100">
                <strong class="flex-grow-1 text-truncate" x-text="name" style="min-width:0"></strong>

                <div class="d-flex gap-2 ms-auto flex-no-shrink">
                    <select class="form-select form-select-sm input-w-210" x-model="type">
                        <option value="OTHER">Other</option>
                        <option value="RAW_CARD">Raw Card</option>
                        <option value="GRADED_CARD">Graded Card</option>
                        <option value="SEALED_PRODUCT">Sealed</option>
                    </select>

                    <button type="button" class="btn btn-sm btn-outline-danger p-0 lot-btn-sq"
                            @click="$el.closest('.item-row').remove(); window.dispatchEvent(new CustomEvent('inv:changed'))">&#10005;
                    </button>
                </div>
            </div>

            <div class="d-flex align-items-start w-100 lot-row-middle">
                <div class="text-muted text-truncate flex-grow-1 lot-row-meta" x-show="setName">
                    <span x-text="setName"></span>
                    <template x-if="cardNumber"><span> · <span x-text="cardNumber"></span></span></template>
                </div>

                <template x-if="isGraded">
                    <div th:replace="~{fragments/forms :: grading-inputs}"></div>
                </template>
            </div>

            <div class="d-flex align-items-center gap-2 mt-1 lot-row-pricing">
                <span class="text-muted">Cost $</span>
                <input type="number" class="form-control form-control-sm text-end input-w-90"
                       step="0.01" min="0" x-model.number="costBasis">
                <span class="text-muted">Mkt $</span>
                <input type="number" class="form-control form-control-sm text-end input-w-90"
                       step="0.01" min="0" x-model.number="market">
            </div>

        </div>
    </div>
</div>
</body>
</html>
