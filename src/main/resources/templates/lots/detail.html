<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">

<a th:replace="~{fragments/items :: back-link(url='/lots', label='Lots')}"></a>

<div class="d-flex justify-content-between align-items-start mb-4">
    <div class="flex-grow-1 me-3 min-w-0">
        <h4 class="mb-1" th:text="${lot.sellerName}"></h4>
        <small class="text-muted">
            <span th:if="${lot.purchaseDate != null}" th:replace="~{fragments/items :: date-color(date=${lot.purchaseDate})}"></span>
            <span th:if="${lot.description != null and !lot.description.isEmpty()}" th:text="' · ' + ${lot.description}"></span>
        </small>
    </div>
    <div class="d-flex gap-2 flex-shrink-0">
        <a th:href="'/lots/' + ${lot.id} + '/edit'" class="btn btn-outline-secondary btn-sm">Edit</a>
        <form th:replace="~{fragments/items :: delete-button(action='/lots/' + ${lot.id} + '/delete', message='Delete this lot and all its tracked items? This cannot be undone.')}"></form>
    </div>
</div>

<div class="card mb-3">
    <div class="card-body">
        <div class="row text-center">
            <div th:replace="~{fragments/items :: stat-col(label='Cost', value='$' + ${#numbers.formatDecimal(lot.totalCost, 1, 2)}, valueClass='')}"></div>
            <div th:replace="~{fragments/items :: stat-col(label='EMV', value=${lot.estimatedMarketValue != 0 ? '$' + #numbers.formatDecimal(lot.estimatedMarketValue, 1, 2) : '—'}, valueClass='')}"></div>
            <div th:replace="~{fragments/items :: stat-col(label='Items', value=${lot.trackedItems != null ? lot.trackedItems.size() : 0}, valueClass='')}"></div>
            <div class="col">
                <div class="text-muted small text-uppercase">Status</div>
                <div><span th:replace="~{fragments/items :: lot-status-badge(status=${lot.status})}"></span></div>
            </div>
        </div>
    </div>
</div>

<span th:replace="~{fragments/items :: section-pill(label='Lot Contents')}"></span>
<p th:if="${#lists.isEmpty(snapshotItems)}" class="text-muted small">No items recorded. <a th:href="'/lots/' + ${lot.id} + '/edit'">Edit lot</a> to add items.</p>
<table th:unless="${#lists.isEmpty(snapshotItems)}" class="table table-sm table-hover bg-white mb-4">
    <thead class="table-light">
    <tr>
        <th style="width:100%">Item</th>
        <th class="text-center text-nowrap ps-4">Type</th>
        <th class="text-center text-nowrap ps-4">Qty</th>
        <th class="text-center text-nowrap ps-4">Spent</th>
        <th class="text-center text-nowrap ps-4">Tracked</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${snapshotItems}">
        <td>
            <div class="d-flex align-items-center gap-2">
                <img th:if="${item.imageUrl != null and !item.imageUrl.isEmpty()}" th:src="${item.imageUrl}" class="card-thumb" th:attr="data-card-img=${item.imageUrl}">
                <div>
                    <span class="fw-medium" th:text="${item.name}"></span>
                    <div th:if="${item.setName != null and !item.setName.isEmpty()}" class="text-muted inv-subtext">
                        <span th:text="${item.setName}"></span>
                    </div>
                </div>
            </div>
        </td>
        <td class="text-center align-middle text-nowrap ps-4">
            <th:block th:replace="~{fragments/items :: type-badge(item=${item})}"></th:block>
        </td>
        <td class="text-center align-middle text-nowrap ps-4" th:text="${item.qty}"></td>
        <td class="text-center align-middle text-nowrap ps-4 fw-medium" th:text="'$' + ${#numbers.formatDecimal(item.offered, 1, 2)}"></td>
        <td class="text-center align-middle text-nowrap ps-4">
            <span th:if="${item.tracked}" class="badge bg-success">Tracked</span>
            <span th:unless="${item.tracked}" class="badge bg-secondary">Not Tracked</span>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${lot.trackedItems != null and !lot.trackedItems.isEmpty()}">
    <span th:replace="~{fragments/items :: section-pill(label='Tracked Items')}"></span>
    <table class="table table-sm table-hover bg-white">
        <thead class="table-light">
        <tr>
            <th style="width:100%">Item</th>
            <th class="text-center text-nowrap ps-4">Type</th>
            <th class="text-center text-nowrap ps-4">Cost Basis</th>
            <th class="text-center text-nowrap ps-4">Market</th>
            <th class="text-center text-nowrap ps-4">Purpose</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ti : ${lot.trackedItems}">
            <td>
                <div th:replace="~{fragments/items :: item-cell(item=${ti})}"></div>
            </td>
            <td class="text-center align-middle text-nowrap ps-4">
                <th:block th:replace="~{fragments/items :: type-badge(item=${ti})}"></th:block>
            </td>
            <td class="text-center align-middle text-nowrap ps-4 fw-medium" th:text="'$' + ${#numbers.formatDecimal(ti.costBasis, 1, 2)}"></td>
            <td class="text-center align-middle text-nowrap ps-4 text-muted" th:text="${ti.marketValueAtPurchase != 0 ? '$' + #numbers.formatDecimal(ti.marketValueAtPurchase, 1, 2) : '—'}"></td>
            <td class="text-center align-middle text-nowrap ps-4">
                <span th:replace="~{fragments/items :: purpose-badge(purpose=${ti.purpose})}"></span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div th:if="${lot.status.name() == 'PENDING'}" class="d-flex justify-content-end gap-2 mt-3">
    <form method="POST" th:action="'/lots/' + ${lot.id} + '/status'" class="d-inline">
        <input type="hidden" name="action" value="REJECT">
        <button type="submit" class="btn btn-outline-danger btn-sm">&#10005; Reject</button>
    </form>
    <form method="POST" th:action="'/lots/' + ${lot.id} + '/status'" class="d-inline">
        <input type="hidden" name="action" value="ACCEPT">
        <button type="submit" class="btn btn-success btn-sm">Accept</button>
    </form>
</div>

</div>
</body>
</html>
