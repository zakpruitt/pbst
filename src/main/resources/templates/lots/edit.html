<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">

<a th:replace="~{fragments/items :: back-link(url='/lots/' + ${lot.id}, label=${lot.sellerName})}"></a>
<h4 class="mb-4">Edit Lot</h4>

<form id="lot-form" method="POST" th:action="'/lots/' + ${lot.id}">
    <div class="card mb-3">
        <div class="card-body">
            <h6 class="card-title mb-3">Lot Details</h6>
            <div class="row g-2">
                <div class="col-12">
                    <input name="sellerName" class="form-control form-control-sm" th:value="${lot.sellerName}" required>
                </div>
                <div class="col-sm-6">
                    <input name="purchaseDate" type="date" class="form-control form-control-sm"
                           th:value="${lot.purchaseDate != null ? #temporals.format(lot.purchaseDate, 'yyyy-MM-dd') : ''}" required>
                </div>
                <div class="col-sm-6">
                    <input name="description" class="form-control form-control-sm"
                           th:value="${lot.description}" placeholder="Notes (optional)">
                </div>
            </div>
        </div>
    </div>

    <div x-data="lotTotals()" @input.window="recalc()" @change.window="recalc()" @lot:changed.window="recalc()">
        <div id="items-list">
            <th:block th:each="item : ${snapshotItems}">
                <div th:replace="~{lots/partials/row :: lot-row(${item})}"></div>
            </th:block>
        </div>
        <div id="empty-msg" class="text-center text-muted py-4 small card mb-3"
             th:style="${#lists.isEmpty(snapshotItems) ? '' : 'display:none'}">No items.</div>

        <div th:replace="~{fragments/forms :: item-search(component='cardSearch()', placeholder='Search cards by name or set...')}"></div>

        <div th:replace="~{fragments/forms :: lot-totals(submitLabel='Save Changes')}"></div>
    </div>
</form>

<script src="/static/js/item-form.js"></script>

</div>
</body>
</html>
