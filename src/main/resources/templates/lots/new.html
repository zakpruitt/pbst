<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">

<a th:replace="~{fragments/items :: back-link(url='/lots', label='Lots')}"></a>
<h4 class="mb-4">New Lot</h4>

<form id="lot-form" method="POST" action="/lots" novalidate>
    <div class="card mb-3">
        <div class="card-body">
            <h6 class="card-title mb-3">Lot Details</h6>
            <div class="row g-2">
                <div class="col-12">
                    <input name="sellerName" class="form-control form-control-sm" placeholder="Seller name" required>
                </div>
                <div class="col-sm-6">
                    <input name="purchaseDate" type="date" class="form-control form-control-sm" required>
                </div>
                <div class="col-sm-6">
                    <input name="description" class="form-control form-control-sm" placeholder="Notes (optional)">
                </div>
            </div>
        </div>
    </div>

    <div x-data="lotTotals()" @input.window="recalc()" @change.window="recalc()" @lot:changed.window="recalc()">
        <div id="items-list"></div>
        <div id="empty-msg" class="text-center text-muted py-4 small card mb-3">Search for a card below, or add an Other item.</div>

        <div th:replace="~{fragments/forms :: item-search(component='cardSearch()', placeholder='Search cards by name or set...')}"></div>

        <div th:replace="~{fragments/forms :: lot-totals(submitLabel='Save Lot')}"></div>
    </div>
</form>

<script src="/static/js/item-form.js"></script>

</div>
</body>
</html>
