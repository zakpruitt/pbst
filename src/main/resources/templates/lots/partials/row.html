<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="lot-row(item)"
     class="item-row card mb-2"
     x-data="lotRow"
     th:data-name="${item.name}"
     th:data-qty="${item.qty}"
     th:data-market="${item.marketPrice}"
     th:data-pct="${item.percentage}"
     th:data-type="${item.itemType}"
     th:data-tracked="${item.isTracked}"
     th:data-grading-company="${item.gradingCompany != null ? item.gradingCompany : 'PSA'}"
     th:data-card-id="${item.pokemonCardId != null ? item.pokemonCardId : ''}"
     th:data-image-url="${item.imageUrl != null ? item.imageUrl : ''}"
     th:data-set-name="${item.setName != null ? item.setName : ''}"
     th:data-card-number="${item.cardNumber != null ? item.cardNumber : ''}"
     th:data-rarity="${item.rarity != null ? item.rarity : ''}"
     :style="'border-left:3px solid '+borderColor">

<div class="d-flex gap-3 p-2 align-items-center">

    <template x-if="imageUrl">
        <div class="lot-img-wrap">
            <img :src="imageUrl" :data-card-img="imageUrl"
                 class="img-fluid rounded shadow-sm obj-fit-contain">
        </div>
    </template>

    <div class="flex-grow-1 d-flex flex-column lot-row-content">

        <div class="d-flex gap-2 align-items-center w-100">
            <strong class="flex-grow-1 text-truncate" x-text="name" style="min-width:0"></strong>

            <div class="d-flex gap-2 ms-auto flex-no-shrink">
                <select class="form-select form-select-sm input-w-210"
                        x-model="type">
                    <option value="RAW_CARD">Raw Card</option>
                    <option value="GRADED_CARD">Graded Card</option>
                    <option value="SEALED_PRODUCT">Sealed</option>
                    <option value="OTHER">Other</option>
                </select>

                <button type="button" class="btn btn-sm btn-outline-danger p-0 lot-btn-sq"
                        @click="$el.closest('.item-row').remove(); window.dispatchEvent(new CustomEvent('lot:changed'))">&#10005;</button>
            </div>
        </div>

        <div class="d-flex align-items-start w-100 lot-row-middle">
            <div class="text-muted text-truncate flex-grow-1 lot-row-meta" x-show="setName">
                <span x-text="setName"></span>
                <template x-if="cardNumber"><span> · <span x-text="cardNumber"></span></span></template>
            </div>

            <template x-if="isGraded">
                <div th:replace="~{fragments/forms :: grading-inputs}"></div>
            </template>
        </div>

        <div class="d-flex align-items-center gap-2 mt-1 lot-row-pricing">
            <span class="text-muted">Qty</span>
            <input type="number" class="form-control form-control-sm text-end input-w-50"
                   min="1" x-model.number="qty">
            <span class="text-muted">Mkt $</span>
            <input type="number" class="form-control form-control-sm text-end input-w-80"
                   step="0.01" x-model.number="market">
            <span class="text-muted">%</span>
            <input type="number" class="form-control form-control-sm text-end input-w-55"
                   min="1" max="100" x-model.number="pct">
            <span class="text-muted">&rarr;</span>
            <strong class="text-success" x-text="'$'+offered"></strong>

            <label class="d-flex align-items-center gap-2 mb-0 ms-auto" style="cursor: pointer;">
                <span class="text-muted small">Track</span>
                <input type="checkbox" class="form-check-input mt-0 lot-track-check"
                       x-model="tracked">
            </label>
        </div>

    </div>
</div>
</div>
</body>
</html>
